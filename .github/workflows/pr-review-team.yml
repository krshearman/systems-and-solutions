name: Multi-agent PR review team

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number in this repository
        type: number
        required: true
      model:
        description: Model for three SDK requests, with two specialists in parallel
        type: string
        default: gpt-5-mini
        required: true
      allow_model_upload:
        description: I approve sending this diff and guidelines to the model review team
        type: boolean
        default: false
        required: true

permissions: {}

concurrency:
  group: review-team-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review-team:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: copilot-pr-analysis
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require the default branch and explicit data approval
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_UPLOAD: ${{ inputs.allow_model_upload }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" || "$ALLOW_UPLOAD" != "true" ]]; then
            echo "::error::Run from the default branch and explicitly approve model upload."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the pinned SDK and prepare its runtime once
        run: |
          python -m pip install -r requirements-copilot.txt
          python -m copilot download-runtime
      - name: Run parallel specialists followed by coordinator synthesis
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODEL: ${{ inputs.model }}
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::Configure the Copilot credential in the copilot-pr-analysis environment."
            exit 1
          fi
          mkdir -p reports
          python -B -m automation.review_team \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --model "$MODEL" --allow-model-upload \
            --output reports/review-team.json
      - name: Show the advisory team report
        run: cat reports/review-team.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-review-team
          path: |
            reports/review-team.json
            reports/review-team.md
          if-no-files-found: error
          retention-days: 3
