name: Advisory PR impact and security summary

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number in this repository
        type: number
        required: true
      model:
        description: Copilot model available to the configured account
        type: string
        default: gpt-5-mini
        required: true
      allow_model_upload:
        description: I approve sending this PR diff and the guidelines to Copilot
        type: boolean
        default: false
        required: true
      publish:
        description: Also publish an advisory COMMENT review and eligible inline comments
        type: boolean
        default: false
        required: true

permissions: {}

concurrency:
  group: advisory-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: copilot-pr-analysis
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require the default branch and explicit data approval
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_UPLOAD: ${{ inputs.allow_model_upload }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" || "$ALLOW_UPLOAD" != "true" ]]; then
            echo "::error::Run from the default branch and explicitly approve model upload."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install the pinned SDK from trusted workflow code
        run: python -m pip install -r requirements-copilot.txt
      - name: Analyze without checking out or executing PR code
        env:
          GH_TOKEN: ${{ github.token }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODEL: ${{ inputs.model }}
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::Configure the Copilot credential in the copilot-pr-analysis environment."
            exit 1
          fi
          mkdir -p reports
          python -B -m automation.pr_review analyze \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
            --model "$MODEL" --allow-model-upload \
            --output reports/pr-review.json
      - name: Show the advisory report
        run: cat reports/pr-review.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-impact-review
          path: |
            reports/pr-review.json
            reports/pr-review.md
          if-no-files-found: error
          retention-days: 3

  publish:
    if: ${{ inputs.publish }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-impact-review
          path: reports
      - name: Revalidate evidence and post an advisory review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          python -B -m automation.pr_review publish \
            --input reports/pr-review.json \
            --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --confirm-post
