name: Portfolio checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  refactor-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check portfolio contracts without SDK dependencies
        run: python -B -m unittest discover -s tests -v
      - name: Check the approved workspace modernization
        run: python -B tools/check_refactor_guard.py

  incident-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pinned optional SDK
        run: python -m pip install -r requirements-copilot.txt
      - name: Check portfolio contracts and SDK API compatibility without model calls
        run: python -B -m unittest discover -s tests -v
